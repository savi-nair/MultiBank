name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, desktop-firefox, desktop-webkit]
    env:
      CI: 'true'
      CROSS_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project == 'desktop-chromium' && 'chromium' || matrix.project == 'desktop-firefox' && 'firefox' || 'webkit' }}
      - run: npx bddgen && npx playwright test --project=${{ matrix.project }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.project }}
          path: |
            playwright-report/
            allure-results/
          retention-days: 14

  allure:
    name: merged Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: reports-*
      - run: mkdir -p allure-results && cp -r reports-*/allure-results/* allure-results/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx --yes allure-commandline@2.46.1 generate allure-results --clean -o allure-report
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
